<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>BLEACH | GG - фу 👎</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(ellipse at center, #0a0a0a 0%, #000000 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Arial Black', 'Impact', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Частицы на фоне — духовная энергия */
    canvas#particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Основной контейнер надписи */
    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
    }

    /* Главный текст BLEACH */
    .bleach-text {
      font-size: clamp(4rem, 15vw, 10rem);
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: linear-gradient(180deg, 
        #ffffff 0%, 
        #d4d4d4 30%, 
        #6b6b6b 60%, 
        #2a2a2a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px #ffffff80) drop-shadow(0 0 45px #9d0000cc);
      animation: flicker 3s infinite alternate, levitate 6s ease-in-out infinite;
      position: relative;
      display: inline-block;
      margin-bottom: 0.5rem;
      line-height: 1.1;
    }

    /* Подпись в стиле трещин / маски */
    .subtitle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .gg-part {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      background: linear-gradient(135deg, #b30000, #4d0000);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px #ff0000aa, 0 0 35px #b30000;
      letter-spacing: 0.15em;
      animation: pulse-red 2s infinite;
    }

    .fu-part {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      color: #c0c0c0;
      text-shadow: 0 0 20px #aaaaaa, 0 0 35px #444444;
      animation: shiver 0.5s infinite alternate;
      display: inline-block;
    }

    .thumb-emoji {
      font-size: clamp(3rem, 10vw, 6rem);
      filter: drop-shadow(0 0 20px #ff4d4d) drop-shadow(0 0 40px #990000);
      animation: thumb-down 2.5s infinite ease-in-out;
      display: inline-block;
      transform-origin: center;
    }

    /* Эффект свечения за текстом */
    .glow-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120%;
      height: 120%;
      background: radial-gradient(circle, rgba(180,0,0,0.15) 0%, transparent 70%);
      z-index: -1;
      border-radius: 50%;
      animation: expand-glow 4s infinite alternate;
    }

    /* Декоративная линия в стиле меча */
    .zanpakuto-line {
      margin: 1.5rem auto 0.5rem;
      width: 30%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #b30000, #ffffff, #b30000, transparent);
      filter: blur(2px);
      animation: sword-slash 2s infinite ease-in-out;
    }

    /* Анимации */
    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        opacity: 1;
        filter: drop-shadow(0 0 20px #ffffff80) drop-shadow(0 0 45px #9d0000cc);
      }
      20%, 24%, 55% {
        opacity: 0.85;
        filter: drop-shadow(0 0 12px #ffffff40) drop-shadow(0 0 25px #9d0000aa);
      }
    }

    @keyframes levitate {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes pulse-red {
      0% { text-shadow: 0 0 15px #ff0000aa, 0 0 35px #b30000; }
      50% { text-shadow: 0 0 30px #ff3333, 0 0 60px #cc0000, 0 0 15px #ffffff; }
      100% { text-shadow: 0 0 15px #ff0000aa, 0 0 35px #b30000; }
    }

    @keyframes shiver {
      0% { transform: translateX(0px) rotate(0deg); }
      25% { transform: translateX(-2px) rotate(-1deg); }
      75% { transform: translateX(2px) rotate(1deg); }
      100% { transform: translateX(0px) rotate(0deg); }
    }

    @keyframes thumb-down {
      0% { transform: rotate(0deg) scale(1); }
      30% { transform: rotate(-15deg) scale(1.15); }
      60% { transform: rotate(5deg) scale(1.05); }
      100% { transform: rotate(0deg) scale(1); }
    }

    @keyframes expand-glow {
      0% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); }
      100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.2); }
    }

    @keyframes sword-slash {
      0% { opacity: 0.5; width: 20%; }
      50% { opacity: 1; width: 45%; }
      100% { opacity: 0.5; width: 20%; }
    }

    /* Адаптивность */
    @media (max-width: 600px) {
      .subtitle {
        gap: 0.4rem;
      }
      .zanpakuto-line {
        width: 50%;
      }
    }
  </style>
</head>
<body>
  <!-- Canvas для частиц духовной энергии -->
  <canvas id="particles"></canvas>

  <!-- Основная надпись -->
  <div class="container">
    <div class="glow-bg"></div>
    <h1 class="bleach-text">BLEACH</h1>
    <div class="subtitle">
      <span class="gg-part">| GG</span>
      <span class="fu-part">— фу</span>
      <span class="thumb-emoji">👎</span>
    </div>
    <div class="zanpakuto-line"></div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('particles');
      const ctx = canvas.getContext('2d');
      let width, height;
      
      // Массив частиц (духовные искры, напоминающие рейацу)
      let particles = [];

      // Настройки частиц
      const PARTICLE_COUNT = 120;
      const COLORS = [
        'rgba(220, 20, 60, 0.9)',   // красный как кровь/банкай
        'rgba(200, 200, 200, 0.8)', // серебристый
        'rgba(255, 255, 255, 0.7)',
        'rgba(180, 0, 0, 0.8)',
        'rgba(100, 0, 0, 0.6)'
      ];

      class Particle {
        constructor() {
          this.reset();
        }

        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 3.5 + 1.2;
          this.speedX = (Math.random() - 0.5) * 0.7;
          this.speedY = (Math.random() - 0.5) * 0.7 - 0.2; // легкое стремление вверх
          this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
          this.opacity = Math.random() * 0.8 + 0.2;
          this.life = 1;
          this.decay = Math.random() * 0.008 + 0.002;
          this.flickerSpeed = Math.random() * 0.02 + 0.005;
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          
          // Мерцание размера и прозрачности
          this.size += Math.sin(Date.now() * this.flickerSpeed) * 0.1;
          this.opacity = Math.max(0, this.opacity - this.decay);
          
          // Если частица выходит за пределы или исчезает — пересоздаем
          if (this.x < -10 || this.x > width + 10 || 
              this.y < -10 || this.y > height + 10 || 
              this.opacity <= 0.02 || this.size <= 0.2) {
            this.reset();
            // Появляется с краев
            if (Math.random() < 0.5) {
              this.x = Math.random() * width;
              this.y = height + 5;
            } else {
              this.x = Math.random() * width;
              this.y = -5;
            }
            this.opacity = Math.random() * 0.7 + 0.3;
            this.life = 1;
            this.speedY = -Math.random() * 1.2 - 0.3; // движение вверх
          }
        }

        draw(ctx) {
          ctx.save();
          ctx.globalAlpha = this.opacity;
          ctx.shadowColor = this.color.replace(/[^,]+(?=\))/, '1'); // делаем свечение
          ctx.shadowBlur = 5;
          ctx.fillStyle = this.color;
          ctx.beginPath();
          // Рисуем частицу в виде маленькой звездочки/ромба для стиля
          const x = this.x;
          const y = this.y;
          const s = this.size;
          ctx.moveTo(x, y - s);
          ctx.lineTo(x + s * 0.4, y);
          ctx.lineTo(x, y + s);
          ctx.lineTo(x - s * 0.4, y);
          ctx.closePath();
          ctx.fill();
          
          // Дополнительное свечение
          ctx.shadowBlur = 10;
          ctx.fillStyle = 'rgba(255, 100, 100, 0.5)';
          ctx.beginPath();
          ctx.arc(x, y, s * 0.6, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function initCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        
        // Пересоздаем частицы при изменении размера
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          particles.push(new Particle());
        }
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        
        // Рисуем и обновляем частицы
        for (let p of particles) {
          p.update();
          p.draw(ctx);
        }
        
        requestAnimationFrame(animate);
      }

      // Запуск
      window.addEventListener('resize', () => {
        initCanvas();
      });

      initCanvas();
      animate();
    })();
  </script>
</body>
</html>
